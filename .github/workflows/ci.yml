name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composer-validate:
    name: Composer validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate composer.json
        run: Build/Scripts/runTests.sh -s composerValidate -b docker

      - name: Verify cleanup without installed dependencies
        run: Build/Scripts/runTests.sh -s testCleanup -b host

      - name: Verify container backend selection and networking
        run: Build/Scripts/runTests.sh -s testBackend -b host

  libraries:
    name: Locked Classic bundle and TER artefact
    runs-on: ubuntu-24.04
    needs: composer-validate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build and verify the TER artefact
        run: Build/Scripts/runTests.sh -s artefact -p 8.2 -b docker
      - uses: actions/upload-artifact@v6
        with:
          name: classic-ter-package
          path: tailor-version-artefact/*.zip
          if-no-files-found: error

  classic:
    name: TYPO3 ${{ matrix.typo3 }} / PHP ${{ matrix.php }} Classic
    runs-on: ubuntu-24.04
    needs: libraries
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        typo3: ['13', '14']
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v5
      - name: Install the Composer reference setup
        run: Build/Scripts/runTests.sh -s composerInstall -t ${{ matrix.typo3 }} -p ${{ matrix.php }} -b docker
      - name: Download the TER package
        uses: actions/download-artifact@v6
        with:
          name: classic-ter-package
          path: .Build/ter-package
      - name: Build the linked checkout bundle
        run: Build/Scripts/runTests.sh -s libraries -p ${{ matrix.php }} -b docker
      - name: Activate and render in isolated Classic installations
        run: Build/Scripts/runTests.sh -s classic -t ${{ matrix.typo3 }} -p ${{ matrix.php }} -b docker -- "$(echo .Build/ter-package/*.zip)"

  lint:
    name: TYPO3 14 / PHP 8.4 lint
    runs-on: ubuntu-24.04
    needs: composer-validate
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install TYPO3 test setup
        run: Build/Scripts/runTests.sh -s composerInstall -t 14 -p 8.4 -b docker

      - name: Lint PHP files
        run: Build/Scripts/runTests.sh -s lintPhp -t 14 -p 8.4 -b docker

      - name: Lint JSON files
        run: Build/Scripts/runTests.sh -s lintJson -t 14 -p 8.4 -b docker

      - name: Lint YAML files
        run: Build/Scripts/runTests.sh -s lintYaml -t 14 -p 8.4 -b docker

      - name: Lint Services.yaml files
        run: Build/Scripts/runTests.sh -s lintServicesYaml -t 14 -p 8.4 -b docker

      - name: Lint TypoScript files
        run: Build/Scripts/runTests.sh -s lintTypoScript -t 14 -p 8.4 -b docker

      - name: Lint XLIFF files
        run: Build/Scripts/runTests.sh -s lintXliff -t 14 -p 8.4 -b docker

  static-analysis:
    name: TYPO3 14 / PHP 8.4 static analysis
    runs-on: ubuntu-24.04
    needs: composer-validate
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install TYPO3 test setup
        run: Build/Scripts/runTests.sh -s composerInstall -t 14 -p 8.4 -b docker

      - name: Run PHP-CS-Fixer dry-run
        run: PHP_CS_FIXER_IGNORE_ENV=1 Build/Scripts/runTests.sh -s cgl -t 14 -p 8.4 -b docker

      - name: Run PHPStan
        run: Build/Scripts/runTests.sh -s phpstan -t 14 -p 8.4 -b docker

  tests:
    name: TYPO3 ${{ matrix.typo3 }} / PHP ${{ matrix.php }} tests
    runs-on: ubuntu-24.04
    needs: composer-validate
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        typo3: ['13', '14']
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install TYPO3 test setup
        id: setup
        run: Build/Scripts/runTests.sh -s composerInstall -t ${{ matrix.typo3 }} -p ${{ matrix.php }} -b docker

      - name: Run unit tests
        run: Build/Scripts/runTests.sh -s unit -t ${{ matrix.typo3 }} -p ${{ matrix.php }} -b docker

      - name: Run functional DB matrix
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          Build/Scripts/runTests.sh -s functional -t ${{ matrix.typo3 }} -p ${{ matrix.php }} -b docker -d sqlite
          Build/Scripts/runTests.sh -s functional -t ${{ matrix.typo3 }} -p ${{ matrix.php }} -b docker -d mariadb -a mysqli -i 10.11
          Build/Scripts/runTests.sh -s functional -t ${{ matrix.typo3 }} -p ${{ matrix.php }} -b docker -d mariadb -a pdo_mysql -i 10.11
          Build/Scripts/runTests.sh -s functional -t ${{ matrix.typo3 }} -p ${{ matrix.php }} -b docker -d mariadb -a mysqli -i 11.4
          Build/Scripts/runTests.sh -s functional -t ${{ matrix.typo3 }} -p ${{ matrix.php }} -b docker -d mariadb -a pdo_mysql -i 11.4
          Build/Scripts/runTests.sh -s functional -t ${{ matrix.typo3 }} -p ${{ matrix.php }} -b docker -d mysql -a mysqli -i 8.0
          Build/Scripts/runTests.sh -s functional -t ${{ matrix.typo3 }} -p ${{ matrix.php }} -b docker -d mysql -a pdo_mysql -i 8.0
          Build/Scripts/runTests.sh -s functional -t ${{ matrix.typo3 }} -p ${{ matrix.php }} -b docker -d mysql -a mysqli -i 8.4
          Build/Scripts/runTests.sh -s functional -t ${{ matrix.typo3 }} -p ${{ matrix.php }} -b docker -d mysql -a pdo_mysql -i 8.4
          Build/Scripts/runTests.sh -s functional -t ${{ matrix.typo3 }} -p ${{ matrix.php }} -b docker -d postgres -i 15
          Build/Scripts/runTests.sh -s functional -t ${{ matrix.typo3 }} -p ${{ matrix.php }} -b docker -d postgres -i 16
          Build/Scripts/runTests.sh -s functional -t ${{ matrix.typo3 }} -p ${{ matrix.php }} -b docker -d postgres -i 17
